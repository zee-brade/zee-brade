<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Trazeel • Responsive Sliding Auth</title>

    <style>

        /* =========================================================
           ROOT
        ========================================================= */

        :root {
            --bg: #09090d;
            --surface: #15151c;
            --surface-2: #1c1c25;

            --text: #f5f2ea;
            --text-soft: #aaa7b1;
            --text-muted: #6d6c77;

            --accent: #c9a962;
            --accent-light: #e7cb83;
            --accent-dark: #8d6b36;

            --border: rgba(255,255,255,.08);

            --radius: clamp(18px, 3vw, 32px);

            /* Blur variables */
            --drag-blur: 0px;
            --drag-opacity: 1;
        }


        /* =========================================================
           RESET
        ========================================================= */

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html {
            width: 100%;
            min-height: 100%;
        }


        body {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;

            display: grid;
            place-items: center;

            padding:
                clamp(8px, 3vw, 36px);

            overflow: hidden;

            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            color: var(--text);

            background:
                radial-gradient(
                    circle at 15% 10%,
                    rgba(201,169,98,.14),
                    transparent 28%
                ),

                radial-gradient(
                    circle at 85% 90%,
                    rgba(201,169,98,.08),
                    transparent 30%
                ),

                var(--bg);
        }


        button,
        input {
            font: inherit;
        }


        button {
            border: 0;
        }


        /* =========================================================
           MAIN CONTAINER
        ========================================================= */

        .auth-container {

            position: relative;

            width:
                min(
                    94vw,
                    980px
                );

            height:
                min(
                    84dvh,
                    680px
                );

            overflow: hidden;

            background:
                var(--surface);

            border:
                1px solid
                rgba(255,255,255,.08);

            border-radius:
                var(--radius);

            box-shadow:
                0 35px 100px
                rgba(0,0,0,.5),

                0 0 0 1px
                rgba(255,255,255,.015);

            isolation: isolate;
        }


        /* =========================================================
           FORM AREAS
        ========================================================= */

        .forms {

            position: absolute;

            inset: 0;

            z-index: 1;

            display: flex;

            flex-direction: row;

            width: 100%;
            height: 100%;
        }


        /* =========================================================
           FORM PANEL
        ========================================================= */

        .form-panel {

            position: relative;

            flex:
                0 0 50%;

            width:
                50%;

            height:
                100%;

            display: flex;

            align-items:
                center;

            justify-content:
                center;

            padding:
                clamp(
                    14px,
                    4vw,
                    54px
                );

            overflow: hidden;

            /*
             * Blur hanya dipakai ketika sedang drag.
             */
            filter:
                blur(
                    var(--drag-blur)
                );

            opacity:
                var(--drag-opacity);

            transition:
                filter 140ms ease,
                opacity 140ms ease;

            will-change:
                filter,
                opacity;
        }


        .form-panel::before {

            content: "";

            position: absolute;

            inset: 0;

            pointer-events: none;

            background:
                radial-gradient(
                    circle at center,
                    rgba(255,255,255,.025),
                    transparent 65%
                );
        }


        /* =========================================================
           CONTENT SCALE WRAPPER
        ========================================================= */

        .form-content-scale,
        .overlay-content-scale {

            width:
                100%;

            height:
                auto;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            transform-origin:
                center center;

            will-change:
                transform;
        }


        /* =========================================================
           FORM CONTENT
        ========================================================= */

        .form-content {

            position:
                relative;

            width:
                100%;

            max-width:
                350px;

            flex-shrink:
                0;
        }


        /* =========================================================
           KICKER
        ========================================================= */

        .form-kicker {

            display:
                block;

            margin-bottom:
                9px;

            color:
                var(--accent);

            font-size:
                10px;

            font-weight:
                900;

            letter-spacing:
                .17em;

            text-transform:
                uppercase;
        }


        /* =========================================================
           TITLE
        ========================================================= */

        .form-content h1 {

            margin-bottom:
                10px;

            font-size:
                clamp(
                    28px,
                    4vw,
                    42px
                );

            line-height:
                1.05;

            letter-spacing:
                -.045em;
        }


        /* =========================================================
           DESCRIPTION
        ========================================================= */

        .form-description {

            margin-bottom:
                25px;

            color:
                var(--text-soft);

            font-size:
                13px;

            line-height:
                1.7;
        }


        /* =========================================================
           FIELD
        ========================================================= */

        .field {

            margin-bottom:
                15px;
        }


        .field label {

            display:
                block;

            margin-bottom:
                7px;

            color:
                #aaa8b2;

            font-size:
                12px;

            font-weight:
                700;
        }


        .field input {

            display:
                block;

            width:
                100%;

            height:
                50px;

            padding:
                0 15px;

            border:
                1px solid
                rgba(255,255,255,.08);

            border-radius:
                13px;

            outline:
                none;

            background:
                #1d1d26;

            color:
                #ffffff;

            font-size:
                14px;

            transition:
                border-color .18s ease,
                background .18s ease,
                box-shadow .18s ease;
        }


        .field input::placeholder {
            color:
                #5f5e69;
        }


        .field input:focus {

            border-color:
                rgba(201,169,98,.72);

            background:
                #20202a;

            box-shadow:
                0 0 0 4px
                rgba(201,169,98,.08);
        }


        /* =========================================================
           SUBMIT
        ========================================================= */

        .submit-btn {

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            width:
                100%;

            min-height:
                52px;

            margin-top:
                6px;

            border-radius:
                14px;

            cursor:
                pointer;

            color:
                #17120c;

            font-size:
                13px;

            font-weight:
                900;

            background:
                linear-gradient(
                    135deg,
                    var(--accent-light),
                    var(--accent-dark)
                );

            box-shadow:
                0 12px 30px
                rgba(169,129,63,.2);

            transition:
                transform .18s ease,
                box-shadow .18s ease,
                filter .18s ease;
        }


        .submit-btn:hover {

            transform:
                translateY(-2px);

            filter:
                brightness(1.05);

            box-shadow:
                0 17px 34px
                rgba(169,129,63,.28);
        }


        .submit-btn:active {
            transform:
                translateY(0);
        }


        /* =========================================================
           OVERLAY
        ========================================================= */

        .overlay {

            position:
                absolute;

            top:
                0;

            right:
                0;

            width:
                50%;

            height:
                100%;

            z-index:
                10;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            padding:
                clamp(
                    14px,
                    4vw,
                    54px
                );

            text-align:
                center;

            color:
                #ffffff;

            background:

                radial-gradient(
                    circle at 15% 15%,
                    rgba(255,255,255,.17),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 90% 90%,
                    rgba(255,255,255,.08),
                    transparent 30%
                ),

                linear-gradient(
                    145deg,
                    #c9a962,
                    #8d6b36
                );

            box-shadow:
                -18px 0 50px
                rgba(0,0,0,.14);

            transform:
                translate3d(
                    0,
                    0,
                    0
                );

            transition:
                transform
                650ms
                cubic-bezier(
                    .77,
                    0,
                    .18,
                    1
                );

            touch-action:
                none;

            user-select:
                none;

            cursor:
                grab;

            will-change:
                transform;
        }


        .overlay.dragging {

            cursor:
                grabbing;

            transition:
                none;

            box-shadow:
                -18px 0 55px
                rgba(201,169,98,.22);
        }


        /* =========================================================
           OVERLAY CONTENT
        ========================================================= */

        .overlay-content {

            width:
                100%;

            max-width:
                320px;

            flex-shrink:
                0;
        }


        /* =========================================================
           BADGE
        ========================================================= */

        .overlay-badge {

            display:
                inline-flex;

            align-items:
                center;

            justify-content:
                center;

            min-height:
                28px;

            padding:
                0 12px;

            margin-bottom:
                18px;

            border:
                1px solid
                rgba(255,255,255,.25);

            border-radius:
                999px;

            background:
                rgba(255,255,255,.09);

            backdrop-filter:
                blur(12px);

            font-size:
                9px;

            font-weight:
                900;

            letter-spacing:
                .15em;

            text-transform:
                uppercase;
        }


        /* =========================================================
           OVERLAY TITLE
        ========================================================= */

        .overlay h2 {

            margin-bottom:
                14px;

            font-size:
                clamp(
                    28px,
                    4vw,
                    40px
                );

            line-height:
                1.04;

            letter-spacing:
                -.045em;
        }


        /* =========================================================
           OVERLAY DESCRIPTION
        ========================================================= */

        .overlay-description {

            max-width:
                320px;

            margin:
                0 auto 24px;

            color:
                rgba(255,255,255,.85);

            font-size:
                13px;

            line-height:
                1.7;
        }


        /* =========================================================
           HINT
        ========================================================= */

        .overlay-hint {

            margin-bottom:
                12px;

            color:
                rgba(255,255,255,.62);

            font-size:
                10px;

            line-height:
                1.5;
        }


        /* =========================================================
   ARROW PULSE / HEARTBEAT
========================================================= */

.arrow-btn {
    position: relative;

    width: 64px;
    height: 64px;

    display: inline-flex;

    align-items: center;
    justify-content: center;

    border: 1px solid rgba(255,255,255,.35);

    border-radius: 50%;

    color: #ffffff;

    background:
        rgba(255,255,255,.10);

    backdrop-filter:
        blur(12px);

    cursor: pointer;

    font-size: 28px;
    line-height: 1;

    transition:
        transform .2s ease,
        background .2s ease,
        border-color .2s ease;

    /*
     * Pulse utama.
     */
    animation:
        arrowHeartbeat 2.2s ease-in-out infinite;
}


/*
 * Lingkaran cahaya yang melebar
 * dari belakang tombol.
 */
.arrow-btn::before {
    content: "";

    position: absolute;

    inset: -7px;

    border-radius: 50%;

    border:
        1px solid
        rgba(255,255,255,.20);

    opacity: 0;

    transform: scale(.82);

    animation:
        arrowRipple 2.2s ease-out infinite;

    pointer-events: none;
}


/*
 * Glow halus di bagian dalam.
 */
.arrow-btn::after {
    content: "";

    position: absolute;

    inset: 0;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.14),
            transparent 65%
        );

    opacity: .45;

    pointer-events: none;
}


/* =========================================================
   HEARTBEAT
========================================================= */

@keyframes arrowHeartbeat {

    0%,
    100% {
        transform: scale(1);
    }

    8% {
        transform: scale(1.06);
    }

    16% {
        transform: scale(1);
    }

    24% {
        transform: scale(1.045);
    }

    32% {
        transform: scale(1);
    }

    60% {
        transform: scale(1);
    }
}


/* =========================================================
   RIPPLE
========================================================= */

@keyframes arrowRipple {

    0% {
        opacity: 0;
        transform: scale(.82);
    }

    10% {
        opacity: .45;
    }

    55% {
        opacity: 0;
        transform: scale(1.35);
    }

    100% {
        opacity: 0;
        transform: scale(1.35);
    }
}


/* =========================================================
   HOVER
========================================================= */

.arrow-btn:hover {
    transform:
        scale(1.08);

    background:
        rgba(255,255,255,.18);

    border-color:
        rgba(255,255,255,.52);

    animation-play-state:
        paused;
}


/* =========================================================
   PRESS
========================================================= */

.arrow-btn:active {
    transform:
        scale(.94);

    animation-play-state:
        paused;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

    .arrow-btn {
        animation-duration:
            2s;
    }

    .arrow-btn::before {
        animation-duration:
            2s;
    }
}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media (prefers-reduced-motion: reduce) {

    .arrow-btn,
    .arrow-btn::before {
        animation:
            none !important;
    }
}


        /* =========================================================
           DESKTOP / TABLET
        ========================================================= */

        @media (min-width: 701px) {

            .auth-container.signup-open
            .overlay {

                transform:
                    translate3d(
                        -100%,
                        0,
                        0
                    );
            }
        }


        /* =========================================================
           TABLET
        ========================================================= */

        @media (min-width: 701px)
        and (max-width: 1000px) {

            .auth-container {

                width:
                    min(
                        94vw,
                        900px
                    );

                height:
                    min(
                        82dvh,
                        620px
                    );
            }


            .form-panel {

                padding:
                    clamp(
                        20px,
                        4vw,
                        42px
                    );
            }


            .overlay {

                padding:
                    clamp(
                        20px,
                        4vw,
                        42px
                    );
            }
        }


        /* =========================================================
           MOBILE
           
           Vertical layout
        ========================================================= */

        @media (max-width: 700px) {

            body {

                display:
                    grid;

                place-items:
                    center;

                padding:
                    8px;

                overflow:
                    hidden;
            }


            /*
             * Container mengikuti device.
             */
            .auth-container {

                width:
                    min(
                        94vw,
                        480px
                    );

                height:
                    min(
                        88dvh,
                        760px
                    );

                margin:
                    0 auto;

                border-radius:
                    clamp(
                        18px,
                        5vw,
                        25px
                    );
            }


            /* ---------------------------------------------
               STACK FORMS
            --------------------------------------------- */

            .forms {

                flex-direction:
                    column;
            }


            .form-panel {

                width:
                    100%;

                height:
                    50%;

                flex:
                    0 0 50%;

                padding:
                    clamp(
                        10px,
                        5vw,
                        32px
                    );
            }


            /*
             * Content tetap di-center.
             */
            .form-content {

                max-width:
                    min(
                        90%,
                        380px
                    );
            }


            /* ---------------------------------------------
               MOBILE OVERLAY
            --------------------------------------------- */

            .overlay {

                top:
                    auto;

                right:
                    0;

                bottom:
                    0;

                width:
                    100%;

                height:
                    50%;

                padding:
                    clamp(
                        10px,
                        5vw,
                        32px
                    );

                transform:
                    translate3d(
                        0,
                        0,
                        0
                    );

                box-shadow:
                    0 -20px 55px
                    rgba(0,0,0,.16);
            }


            /*
             * Sign Up:
             * overlay naik.
             */
            .auth-container.signup-open
            .overlay {

                transform:
                    translate3d(
                        0,
                        -100%,
                        0
                    );
            }


            /*
             * Mobile arrow:
             * ukurannya fleksibel.
             */
            .arrow-btn {

                width:
                    clamp(
                        48px,
                        14vw,
                        62px
                    );

                height:
                    clamp(
                        48px,
                        14vw,
                        62px
                    );

                font-size:
                    clamp(
                        22px,
                        7vw,
                        30px
                    );
            }
        }


        /* =========================================================
           SMALL PHONE
        ========================================================= */

        @media (max-width: 420px) {

            .auth-container {

                width:
                    95vw;

                height:
                    min(
                        90dvh,
                        720px
                    );
            }


            .form-panel,
            .overlay {

                padding:
                    clamp(
                        8px,
                        4vw,
                        20px
                    );
            }


            .form-content {

                max-width:
                    92%;
            }


            .form-kicker {

                font-size:
                    8px;
            }


            .form-content h1 {

                font-size:
                    clamp(
                        24px,
                        8vw,
                        30px
                    );
            }


            .form-description {

                font-size:
                    10px;

                margin-bottom:
                    17px;
            }


            .field {

                margin-bottom:
                    10px;
            }


            .field label {

                font-size:
                    10px;
            }


            .field input {

                height:
                    clamp(
                        40px,
                        11vw,
                        47px
                    );

                padding:
                    0 12px;

                font-size:
                    11px;
            }


            .submit-btn {

                min-height:
                    clamp(
                        40px,
                        11vw,
                        48px
                    );

                border-radius:
                    11px;

                font-size:
                    11px;
            }


            .overlay-badge {

                min-height:
                    24px;

                padding:
                    0 9px;

                margin-bottom:
                    11px;

                font-size:
                    7px;
            }


            .overlay h2 {

                font-size:
                    clamp(
                        24px,
                        8vw,
                        30px
                    );
            }


            .overlay-description {

                max-width:
                    90%;

                margin-bottom:
                    15px;

                font-size:
                    10px;
            }


            .overlay-hint {

                margin-bottom:
                    9px;

                font-size:
                    8px;
            }
        }


        /* =========================================================
           VERY SMALL PHONE
        ========================================================= */

        @media (max-width: 360px) {

            .auth-container {

                width:
                    96vw;

                height:
                    91dvh;
            }


            .form-panel,
            .overlay {

                padding:
                    7px 12px;
            }


            .form-content {

                max-width:
                    94%;
            }


            .form-content h1 {

                font-size:
                    23px;
            }


            .field input {

                height:
                    38px;

                font-size:
                    10px;
            }


            .submit-btn {

                min-height:
                    39px;

                font-size:
                    10px;
            }


            .overlay h2 {

                font-size:
                    23px;
            }


            .overlay-description {

                font-size:
                    9px;

                line-height:
                    1.5;
            }


            .arrow-btn {

                width:
                    45px;

                height:
                    45px;

                font-size:
                    22px;
            }
        }


        /* =========================================================
           LANDSCAPE PHONE
        ========================================================= */

        @media (max-width: 700px)
        and (orientation: landscape) {

            body {

                padding:
                    5px;
            }


            .auth-container {

                width:
                    min(
                        94vw,
                        820px
                    );

                height:
                    94dvh;
            }


            .form-panel,
            .overlay {

                padding:
                    8px 20px;
            }


            .form-content {

                max-width:
                    400px;
            }


            .overlay-content {

                max-width:
                    380px;
            }
        }


        /* =========================================================
           FOCUS
        ========================================================= */

        button:focus-visible,
        input:focus-visible {

            outline:
                2px solid
                rgba(229,202,133,.85);

            outline-offset:
                3px;
        }


        /* =========================================================
           REDUCED MOTION
        ========================================================= */

        @media (prefers-reduced-motion: reduce) {

            .overlay,
            .arrow-btn,
            .submit-btn,
            .field input,
            .form-panel {

                transition:
                    none !important;
            }
        }

    </style>
</head>


<body>


<!-- =========================================================
     MAIN CONTAINER
========================================================= -->

<main
    class="auth-container"
    id="authContainer"
>


    <!-- =====================================================
         TWO FORMS
    ====================================================== -->

    <div
        class="forms"
        id="forms"
    >


        <!-- =================================================
             LOGIN
        ================================================== -->

        <section
            class="form-panel"
            id="loginPanel"
        >

            <div
                class="form-content-scale"
                id="loginScale"
            >

                <div
                    class="form-content"
                >

                    <span
                        class="form-kicker"
                    >
                        Welcome Back
                    </span>


                    <h1>
                        Login
                    </h1>


                    <p
                        class="form-description"
                    >
                        Masuk ke akun kamu dan
                        lanjutkan perjalananmu.
                    </p>


                    <form
                        id="loginForm"
                    >

                        <div class="field">

                            <label
                                for="loginEmail"
                            >
                                Email
                            </label>

                            <input
                                id="loginEmail"
                                type="email"
                                autocomplete="email"
                                placeholder="you@example.com"
                                required
                            >

                        </div>


                        <div class="field">

                            <label
                                for="loginPassword"
                            >
                                Password
                            </label>

                            <input
                                id="loginPassword"
                                type="password"
                                autocomplete="current-password"
                                placeholder="••••••••"
                                required
                            >

                        </div>


                        <button
                            class="submit-btn"
                            type="submit"
                        >
                            Login
                        </button>

                    </form>

                </div>

            </div>

        </section>


        <!-- =================================================
             SIGN UP
        ================================================== -->

        <section
            class="form-panel"
            id="signupPanel"
        >

            <div
                class="form-content-scale"
                id="signupScale"
            >

                <div
                    class="form-content"
                >

                    <span
                        class="form-kicker"
                    >
                        New Account
                    </span>


                    <h1>
                        Sign Up
                    </h1>


                    <p
                        class="form-description"
                    >
                        Buat akun baru dan mulai
                        perjalanan trading kamu.
                    </p>


                    <form
                        id="signupForm"
                    >

                        <div class="field">

                            <label
                                for="signupName"
                            >
                                Name
                            </label>

                            <input
                                id="signupName"
                                type="text"
                                autocomplete="name"
                                placeholder="Nama kamu"
                                required
                            >

                        </div>


                        <div class="field">

                            <label
                                for="signupEmail"
                            >
                                Email
                            </label>

                            <input
                                id="signupEmail"
                                type="email"
                                autocomplete="email"
                                placeholder="you@example.com"
                                required
                            >

                        </div>


                        <div class="field">

                            <label
                                for="signupPassword"
                            >
                                Password
                            </label>

                            <input
                                id="signupPassword"
                                type="password"
                                autocomplete="new-password"
                                placeholder="••••••••"
                                required
                            >

                        </div>


                        <button
                            class="submit-btn"
                            type="submit"
                        >
                            Sign Up
                        </button>

                    </form>

                </div>

            </div>

        </section>

    </div>


    <!-- =====================================================
         SLIDING OVERLAY
    ====================================================== -->

    <aside
        class="overlay"
        id="overlay"
        aria-label="Authentication switch panel"
    >

        <div
            class="overlay-content-scale"
            id="overlayScale"
        >

            <div
                class="overlay-content"
            >

                <div
                    class="overlay-badge"
                >
                    Trazeel Auth
                </div>


                <h2
                    id="overlayTitle"
                >
                    Welcome Back
                </h2>


                <p
                    class="overlay-description"
                    id="overlayDescription"
                >
                    Sudah punya akun?
                    Masuk dan lanjutkan
                    perjalananmu.
                </p>


                <p
                    class="overlay-hint"
                >
                    Geser panel atau tekan
                    tombol panah untuk berpindah.
                </p>


                <button
                    class="arrow-btn"
                    id="arrowBtn"
                    type="button"
                    aria-label="Open sign up"
                >
                    →
                </button>

            </div>

        </div>

    </aside>


</main>


<script>

/* =========================================================
   ELEMENTS
========================================================= */

const authContainer =
    document.getElementById(
        "authContainer"
    );


const loginPanel =
    document.getElementById(
        "loginPanel"
    );


const signupPanel =
    document.getElementById(
        "signupPanel"
    );


const loginScale =
    document.getElementById(
        "loginScale"
    );


const signupScale =
    document.getElementById(
        "signupScale"
    );


const overlay =
    document.getElementById(
        "overlay"
    );


const overlayScale =
    document.getElementById(
        "overlayScale"
    );


const arrowBtn =
    document.getElementById(
        "arrowBtn"
    );


const overlayTitle =
    document.getElementById(
        "overlayTitle"
    );


const overlayDescription =
    document.getElementById(
        "overlayDescription"
    );


const loginForm =
    document.getElementById(
        "loginForm"
    );


const signupForm =
    document.getElementById(
        "signupForm"
    );


/* =========================================================
   STATE
========================================================= */

let signupOpen =
    false;


let dragging =
    false;


let didDrag =
    false;


let pointerStartX =
    0;


let pointerStartY =
    0;


let overlayStartX =
    0;


let overlayStartY =
    0;


let resizeTimer =
    null;


/*
 * Swipe threshold.
 */
const SWIPE_THRESHOLD =
    75;


/* =========================================================
   MOBILE CHECK
========================================================= */

function isMobile() {

    return window.matchMedia(
        "(max-width: 700px)"
    ).matches;

}


/* =========================================================
   UPDATE OVERLAY CONTENT
========================================================= */

function updateOverlayContent() {

    const mobile = isMobile();

    if (signupOpen) {

        overlayTitle.textContent =
            "Create Account";

        overlayDescription.textContent =
            "Belum punya akun? Daftar sekarang dan mulai perjalananmu.";

        /*
         * SIGN UP sedang terbuka.
         *
         * Desktop:
         * overlay berada di kiri.
         * Untuk kembali ke Login,
         * panel bergerak ke kanan.
         *
         * Mobile:
         * overlay berada di atas.
         * Untuk kembali ke Login,
         * panel bergerak ke bawah.
         */
        arrowBtn.textContent =
            mobile
                ? "↓"
                : "→";

        arrowBtn.setAttribute(
            "aria-label",
            "Back to login"
        );

    } else {

        overlayTitle.textContent =
            "Welcome Back";

        overlayDescription.textContent =
            "Sudah punya akun? Masuk dan lanjutkan perjalananmu.";

        /*
         * LOGIN sedang terbuka.
         *
         * Desktop:
         * overlay berada di kanan.
         * Untuk membuka Sign Up,
         * panel bergerak ke kiri.
         *
         * Mobile:
         * overlay berada di bawah.
         * Untuk membuka Sign Up,
         * panel bergerak ke atas.
         */
        arrowBtn.textContent =
            mobile
                ? "↑"
                : "←";

        arrowBtn.setAttribute(
            "aria-label",
            "Open sign up"
        );
    }
}


/* =========================================================
   APPLY STATE
========================================================= */

function applyState(
    animate = true
) {

    if (!animate) {

        const oldTransition =
            overlay.style.transition;


        overlay.style.transition =
            "none";


        authContainer.classList.toggle(
            "signup-open",
            signupOpen
        );


        requestAnimationFrame(
            function() {

                requestAnimationFrame(
                    function() {

                        overlay.style.transition =
                            oldTransition;

                    }
                );

            }
        );

    } else {

        authContainer.classList.toggle(
            "signup-open",
            signupOpen
        );

    }


    updateOverlayContent();

}


/* =========================================================
   SCALE CONTENT
========================================================= */

function scaleContentToPanel(
    panel,
    scaleElement
) {

    if (
        !panel ||
        !scaleElement
    ) {

        return;
    }


    /*
     * Reset scale.
     */
    scaleElement.style.transform =
        "scale(1)";


    /*
     * Force reflow.
     */
    void scaleElement.offsetWidth;


    const availableWidth =
        panel.clientWidth;


    const availableHeight =
        panel.clientHeight;


    const contentWidth =
        scaleElement.scrollWidth;


    const contentHeight =
        scaleElement.scrollHeight;


    if (
        availableWidth <= 0 ||
        availableHeight <= 0 ||
        contentWidth <= 0 ||
        contentHeight <= 0
    ) {

        return;
    }


    /*
     * Safe zone:
     * 88% dari ruang panel.
     */
    const safeWidth =
        availableWidth * .88;


    const safeHeight =
        availableHeight * .88;


    const widthScale =
        safeWidth /
        contentWidth;


    const heightScale =
        safeHeight /
        contentHeight;


    /*
     * Ambil faktor terkecil.
     */
    const scale =
        Math.min(
            1,
            widthScale,
            heightScale
        );


    /*
     * Batas bawah supaya
     * isi tidak terlalu mengecil.
     */
    const finalScale =
        Math.max(
            .62,
            scale
        );


    scaleElement.style.transform =
        `scale(${finalScale})`;

}


/* =========================================================
   RESIZE CONTENT
========================================================= */

function resizeInnerContent() {

    requestAnimationFrame(
        function() {

            scaleContentToPanel(
                loginPanel,
                loginScale
            );


            scaleContentToPanel(
                signupPanel,
                signupScale
            );


            scaleContentToPanel(
                overlay,
                overlayScale
            );

        }
    );

}


/* =========================================================
   TOGGLE AUTH
========================================================= */

function toggleAuth() {

    signupOpen =
        !signupOpen;


    applyState(
        true
    );


    resizeInnerContent();

}


/* =========================================================
   ARROW CLICK
========================================================= */

arrowBtn.addEventListener(
    "click",
    function(event) {

        event.stopPropagation();


        /*
         * Jangan double toggle
         * setelah drag.
         */
        if (didDrag) {

            didDrag =
                false;

            return;
        }


        toggleAuth();

    }
);


/* =========================================================
   POINTER DOWN
========================================================= */

overlay.addEventListener(
    "pointerdown",
    function(event) {

        /*
         * Panah punya handler sendiri.
         */
        if (
            event.target.closest(
                ".arrow-btn"
            )
        ) {

            return;
        }


        dragging =
            true;


        didDrag =
            false;


        pointerStartX =
            event.clientX;


        pointerStartY =
            event.clientY;


        /*
         * Simpan posisi awal overlay.
         */

        if (isMobile()) {

            overlayStartY =
                signupOpen
                    ? -overlay.offsetHeight
                    : 0;

        } else {

            overlayStartX =
                signupOpen
                    ? -overlay.offsetWidth
                    : 0;
        }


        overlay.classList.add(
            "dragging"
        );


        /*
         * MULAI BLUR.
         */
        authContainer.classList.add(
            "is-dragging"
        );


        authContainer.style.setProperty(
            "--drag-blur",
            "0px"
        );


        authContainer.style.setProperty(
            "--drag-opacity",
            "1"
        );


        try {

            overlay.setPointerCapture(
                event.pointerId
            );

        } catch (error) {

            /*
             * Pointer capture optional.
             */
        }

    }
);


/* =========================================================
   POINTER MOVE
========================================================= */

overlay.addEventListener(
    "pointermove",
    function(event) {

        if (!dragging) {
            return;
        }


        const deltaX =
            event.clientX -
            pointerStartX;


        const deltaY =
            event.clientY -
            pointerStartY;


        /*
         * Tandai sebagai drag.
         */
        if (
            Math.abs(deltaX) > 7 ||
            Math.abs(deltaY) > 7
        ) {

            didDrag =
                true;

        }


        /* =====================================================
           BLUR PROGRESS
        ===================================================== */

        let progress;


        if (isMobile()) {

            progress =
                Math.abs(deltaY) /
                Math.max(
                    1,
                    overlay.offsetHeight
                );

        } else {

            progress =
                Math.abs(deltaX) /
                Math.max(
                    1,
                    overlay.offsetWidth
                );

        }


        /*
         * Batasi 0 -> 1.
         */
        progress =
            Math.max(
                0,
                Math.min(
                    1,
                    progress
                )
            );


        /*
         * Maksimal blur = 8px.
         */
        const maxBlur =
            8;


        const blurAmount =
            progress *
            maxBlur;


        /*
         * Fade sangat tipis.
         */
        const opacity =
            1 -
            progress * .06;


        authContainer.style.setProperty(
            "--drag-blur",
            `${blurAmount}px`
        );


        authContainer.style.setProperty(
            "--drag-opacity",
            opacity.toString()
        );


        /* =====================================================
           MOBILE MOVEMENT
        ===================================================== */

        if (isMobile()) {

            let nextY =
                overlayStartY +
                deltaY;


            const distance =
                overlay.offsetHeight;


            const minY =
                -distance;


            const maxY =
                0;


            nextY =
                Math.max(
                    minY,
                    Math.min(
                        maxY,
                        nextY
                    )
                );


            overlay.style.transform =
                `translate3d(
                    0,
                    ${nextY}px,
                    0
                )`;


            return;
        }


        /* =====================================================
           DESKTOP / TABLET MOVEMENT
        ===================================================== */

        let nextX =
            overlayStartX +
            deltaX;


        const distance =
            overlay.offsetWidth;


        const minX =
            -distance;


        const maxX =
            0;


        nextX =
            Math.max(
                minX,
                Math.min(
                    maxX,
                    nextX
                )
            );


        overlay.style.transform =
            `translate3d(
                ${nextX}px,
                0,
                0
            )`;

    }
);


/* =========================================================
   FINISH DRAG
========================================================= */

function finishDrag(event) {

    if (!dragging) {
        return;
    }


    dragging =
        false;


    overlay.classList.remove(
        "dragging"
    );


    /*
     * Lepaskan blur.
     *
     * Karena CSS transition,
     * blur akan hilang smooth.
     */
    authContainer.style.setProperty(
        "--drag-blur",
        "0px"
    );


    authContainer.style.setProperty(
        "--drag-opacity",
        "1"
    );


    /*
     * Hapus drag class setelah
     * state blur kembali.
     */
    authContainer.classList.remove(
        "is-dragging"
    );


    const deltaX =
        event.clientX -
        pointerStartX;


    const deltaY =
        event.clientY -
        pointerStartY;


    /* =====================================================
       MOBILE
    ===================================================== */

    if (isMobile()) {

        /*
         * Swipe UP:
         * Login -> Sign Up
         */
        if (
            !signupOpen &&
            deltaY <
                -SWIPE_THRESHOLD
        ) {

            signupOpen =
                true;
        }


        /*
         * Swipe DOWN:
         * Sign Up -> Login
         */
        else if (
            signupOpen &&
            deltaY >
                SWIPE_THRESHOLD
        ) {

            signupOpen =
                false;
        }

    }


    /* =====================================================
       DESKTOP / TABLET
    ===================================================== */

    else {

        /*
         * Swipe LEFT:
         * Login -> Sign Up
         */
        if (
            !signupOpen &&
            deltaX <
                -SWIPE_THRESHOLD
        ) {

            signupOpen =
                true;
        }


        /*
         * Swipe RIGHT:
         * Sign Up -> Login
         */
        else if (
            signupOpen &&
            deltaX >
                SWIPE_THRESHOLD
        ) {

            signupOpen =
                false;
        }

    }


    /*
     * Hapus transform manual.
     */
    overlay.style.transform =
        "";


    /*
     * Snap ke posisi final.
     */
    applyState(
        true
    );


    resizeInnerContent();


    try {

        overlay.releasePointerCapture(
            event.pointerId
        );

    } catch (error) {

        /*
         * Safe to ignore.
         */
    }

}


/* =========================================================
   POINTER UP
========================================================= */

overlay.addEventListener(
    "pointerup",
    finishDrag
);


/* =========================================================
   POINTER CANCEL
========================================================= */

overlay.addEventListener(
    "pointercancel",
    function(event) {

        dragging =
            false;


        overlay.classList.remove(
            "dragging"
        );


        /*
         * Clear blur.
         */
        authContainer.style.setProperty(
            "--drag-blur",
            "0px"
        );


        authContainer.style.setProperty(
            "--drag-opacity",
            "1"
        );


        authContainer.classList.remove(
            "is-dragging"
        );


        /*
         * Kembalikan overlay.
         */
        overlay.style.transform =
            "";


        applyState(
            false
        );


        resizeInnerContent();


        try {

            overlay.releasePointerCapture(
                event.pointerId
            );

        } catch (error) {

            /*
             * Safe to ignore.
             */
        }

    }
);


/* =========================================================
   RESIZE / ROTATE
========================================================= */

function handleResize() {

    clearTimeout(
        resizeTimer
    );


    resizeTimer =
        setTimeout(
            function() {

                overlay.style.transform =
                    "";


                resizeInnerContent();


                /*
                 * Refresh arrow:
                 * horizontal / vertical.
                 */
                applyState(
                    false
                );

            },
            80
        );

}


window.addEventListener(
    "resize",
    handleResize
);


window.addEventListener(
    "orientationchange",
    handleResize
);


/* =========================================================
   RESIZE OBSERVER
========================================================= */

if (
    "ResizeObserver"
    in window
) {

    const resizeObserver =
        new ResizeObserver(
            function() {

                if (!dragging) {

                    resizeInnerContent();

                }

            }
        );


    resizeObserver.observe(
        loginPanel
    );


    resizeObserver.observe(
        signupPanel
    );


    resizeObserver.observe(
        overlay
    );

}


/* =========================================================
   FORM DEMO
========================================================= */

loginForm.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();


        alert(
            "Login form submitted."
        );

    }
);


signupForm.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();


        alert(
            "Sign Up form submitted."
        );

    }
);


/* =========================================================
   INITIALIZE
========================================================= */

function initialize() {

    /*
     * Default:
     * Login.
     */
    signupOpen =
        false;


    updateOverlayContent();


    applyState(
        false
    );


    resizeInnerContent();

}


/*
 * DOM ready.
 */
if (
    document.readyState ===
    "loading"
) {

    document.addEventListener(
        "DOMContentLoaded",
        initialize,
        {
            once: true
        }
    );

} else {

    initialize();

}


/*
 * Final calculation setelah
 * resource/layout selesai.
 */
window.addEventListener(
    "load",
    function() {

        resizeInnerContent();

    },
    {
        once: true
    }
);

</script>

</body>
</html>
