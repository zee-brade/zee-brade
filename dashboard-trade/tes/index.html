<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Trazeel • Sliding Auth</title>


    <style>

        /* =========================================================
           ROOT
        ========================================================= */

        :root {

            --bg:
                #09090d;

            --surface:
                #15151c;

            --surface-2:
                #1d1d26;

            --text:
                #f5f2ea;

            --text-soft:
                #aaa7b1;

            --text-muted:
                #6d6c77;

            --accent:
                #c9a962;

            --accent-light:
                #e7cb83;

            --accent-dark:
                #8d6b36;

            --border:
                rgba(255,255,255,.08);

            --radius:
                clamp(18px, 3vw, 32px);

        }


        /* =========================================================
           RESET
        ========================================================= */

        *,
        *::before,
        *::after {

            box-sizing:
                border-box;

            margin:
                0;

            padding:
                0;

        }


        html,
        body {

            width:
                100%;

            min-height:
                100%;

        }


        body {

            min-height:
                100vh;

            min-height:
                100dvh;

            display:
                grid;

            place-items:
                center;

            padding:
                clamp(
                    8px,
                    3vw,
                    36px
                );

            overflow:
                hidden;

            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            color:
                var(--text);

            background:

                radial-gradient(
                    circle at 15% 10%,
                    rgba(201,169,98,.13),
                    transparent 28%
                ),

                radial-gradient(
                    circle at 85% 90%,
                    rgba(201,169,98,.08),
                    transparent 30%
                ),

                var(--bg);

        }


        button,
        input {

            font:
                inherit;

        }


        button {

            border:
                0;

        }


        /* =========================================================
           MAIN AUTH CONTAINER
        ========================================================= */

        .auth-container {

            position:
                relative;

            width:
                min(
                    94vw,
                    980px
                );

            height:
                min(
                    84dvh,
                    680px
                );

            overflow:
                hidden;

            background:
                var(--surface);

            border:
        1px solid
        rgba(201, 169, 98, .38);

    border-radius:
        var(--radius);

            box-shadow:

                0 40px 100px
                rgba(0,0,0,.48),

                0 0 0 1px
                rgba(255,255,255,.015);

            isolation:
                isolate;

        }


        /* =========================================================
           BASE BORDER
        ========================================================= */

        .auth-container::before {

            content:
                "";

            position:
                absolute;

            inset:
                0;

            z-index:
                90;

            border:
        1px solid
        rgba(201,169,98,.22);

    border-radius:
        inherit;

    pointer-events:
        none;

        }


        /* =========================================================
           BORDER STARS CONTAINER
        ========================================================= */

        .border-stars {

            position:
                absolute;

            inset:
                0;

            z-index:
                100;

            overflow:
                hidden;

            border-radius:
                inherit;

            pointer-events:
                none;

        }


        /* =========================================================
           BORDER STAR
        ========================================================= */

        .border-star {

            position:
                absolute;

            top:
                0;

            left:
                0;

            width:
                3px;

            height:
                3px;

            border-radius:
                50%;

            background:
                #ffffff;

            opacity:
                .12;

            transform:
                translate(
                    -50%,
                    -50%
                );

            box-shadow:

                0 0 3px
                rgba(255,255,255,.98),

                0 0 7px
                rgba(255,255,255,.86),

                0 0 13px
                rgba(255,255,255,.56),

                0 0 22px
                rgba(255,255,255,.22);

            will-change:
                left,
                top,
                opacity,
                transform;

        }


        /* =========================================================
           HORIZONTAL STAR RAY
        ========================================================= */

        .border-star::before {

            content:
                "";

            position:
                absolute;

            left:
                50%;

            top:
                50%;

            width:
                13px;

            height:
                1px;

            transform:
                translate(
                    -50%,
                    -50%
                );

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,.95),
                    transparent
                );

            filter:
                blur(.2px);

            pointer-events:
                none;

        }


        /* =========================================================
           VERTICAL STAR RAY
        ========================================================= */

        .border-star::after {

            content:
                "";

            position:
                absolute;

            left:
                50%;

            top:
                50%;

            width:
                1px;

            height:
                13px;

            transform:
                translate(
                    -50%,
                    -50%
                );

            background:
                linear-gradient(
                    180deg,
                    transparent,
                    rgba(255,255,255,.95),
                    transparent
                );

            filter:
                blur(.2px);

            pointer-events:
                none;

        }


        /* =========================================================
           STAR TWINKLE
        ========================================================= */

        .border-star.active {

            animation:
                starTwinkle
                var(--twinkle-duration,3s)
                ease-in-out
                infinite;

        }


        @keyframes starTwinkle {

            0% {

                opacity:
                    .08;

                transform:
                    translate(
                        -50%,
                        -50%
                    )
                    scale(.72);

            }


            14% {

                opacity:
                    .95;

                transform:
                    translate(
                        -50%,
                        -50%
                    )
                    scale(1.12);

            }


            28% {

                opacity:
                    .28;

                transform:
                    translate(
                        -50%,
                        -50%
                    )
                    scale(.80);

            }


            45% {

                opacity:
                    .82;

                transform:
                    translate(
                        -50%,
                        -50%
                    )
                    scale(1);

            }


            62% {

                opacity:
                    .20;

            }


            78% {

                opacity:
                    .72;

                transform:
                    translate(
                        -50%,
                        -50%
                    )
                    scale(.95);

            }


            100% {

                opacity:
                    .08;

                transform:
                    translate(
                        -50%,
                        -50%
                    )
                    scale(.72);

            }

        }


        /* =========================================================
           FORM WRAPPER
        ========================================================= */

        .forms {

            position:
                absolute;

            inset:
                0;

            z-index:
                1;

            display:
                flex;

            flex-direction:
                row;

            width:
                100%;

            height:
                100%;

        }


        /* =========================================================
           FORM PANEL
        ========================================================= */

        .form-panel {

            position:
                relative;

            flex:
                0 0 50%;

            width:
                50%;

            height:
                100%;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            padding:
                clamp(
                    14px,
                    4vw,
                    54px
                );

            overflow:
                hidden;

            /*
             * FIXED BLUR
             *
             * Blur tidak mengikuti
             * seberapa jauh panel digeser.
             */
            filter:
                blur(0);

            opacity:
                1;

            transition:
                filter 180ms ease,
                opacity 180ms ease;

            will-change:
                filter,
                opacity;

        }


        /*
         * Ketika drag dimulai:
         * blur langsung 4px.
         */

        .auth-container.is-dragging
        .form-panel {

            filter:
                blur(4px);

            opacity:
                .94;

        }


        /*
         * Sedikit soft tambahan
         * untuk isi form.
         */

        .auth-container.is-dragging
        .form-content {

            filter:
                blur(1px);

        }


        /* =========================================================
           FORM INNER
        ========================================================= */

        .form-content-scale {

            width:
                100%;

            height:
                auto;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            transform-origin:
                center center;

            will-change:
                transform;

        }


        .form-content {

            position:
                relative;

            width:
                100%;

            max-width:
                350px;

            flex-shrink:
                0;

        }


        /* =========================================================
           FORM TEXT
        ========================================================= */

        .form-kicker {

            display:
                block;

            margin-bottom:
                9px;

            color:
                var(--accent);

            font-size:
                10px;

            font-weight:
                900;

            letter-spacing:
                .17em;

            text-transform:
                uppercase;

        }


        .form-content h1 {

            margin-bottom:
                10px;

            font-size:
                clamp(
                    28px,
                    4vw,
                    42px
                );

            line-height:
                1.05;

            letter-spacing:
                -.045em;

        }


        .form-description {

            margin-bottom:
                25px;

            color:
                var(--text-soft);

            font-size:
                13px;

            line-height:
                1.7;

        }


        /* =========================================================
           FORM FIELD
        ========================================================= */

        .field {

            margin-bottom:
                15px;

        }


        .field label {

            display:
                block;

            margin-bottom:
                7px;

            color:
                #aaa8b2;

            font-size:
                12px;

            font-weight:
                700;

        }


        .field input {

            display:
                block;

            width:
                100%;

            height:
                50px;

            padding:
                0 15px;

            border:
                1px solid
                rgba(255,255,255,.08);

            border-radius:
                13px;

            outline:
                none;

            background:
                var(--surface-2);

            color:
                #ffffff;

            font-size:
                14px;

            transition:
                border-color .18s ease,
                background .18s ease,
                box-shadow .18s ease;

        }


        .field input::placeholder {

            color:
                #5f5e69;

        }


        .field input:focus {

            border-color:
                rgba(201,169,98,.72);

            background:
                #20202a;

            box-shadow:
                0 0 0 4px
                rgba(201,169,98,.08);

        }


        /* =========================================================
           SUBMIT
        ========================================================= */

        .submit-btn {

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            width:
                100%;

            min-height:
                52px;

            margin-top:
                6px;

            border-radius:
                14px;

            cursor:
                pointer;

            color:
                #17120c;

            font-size:
                13px;

            font-weight:
                900;

            background:
                linear-gradient(
                    135deg,
                    var(--accent-light),
                    var(--accent-dark)
                );

            box-shadow:
                0 12px 30px
                rgba(169,129,63,.20);

            transition:
                transform .18s ease,
                box-shadow .18s ease,
                filter .18s ease;

        }


        .submit-btn:hover {

            transform:
                translateY(-2px);

            filter:
                brightness(1.05);

            box-shadow:
                0 17px 34px
                rgba(169,129,63,.28);

        }


        .submit-btn:active {

            transform:
                translateY(0);

        }


        /* =========================================================
           OVERLAY
        ========================================================= */

        .overlay {

            position:
                absolute;

            top:
                0;

            right:
                0;

            width:
                50%;

            height:
                100%;

            z-index:
                10;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            padding:
                clamp(
                    14px,
                    4vw,
                    54px
                );

            text-align:
                center;

            color:
                #ffffff;

            background:

                radial-gradient(
                    circle at 15% 15%,
                    rgba(255,255,255,.17),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 90% 90%,
                    rgba(255,255,255,.08),
                    transparent 30%
                ),

                linear-gradient(
                    145deg,
                    #c9a962,
                    #8d6b36
                );

            box-shadow:
                -18px 0 50px
                rgba(0,0,0,.14);

            transform:
                translate3d(
                    0,
                    0,
                    0
                );

            transition:
                transform
                650ms
                cubic-bezier(
                    .77,
                    0,
                    .18,
                    1
                );

            touch-action:
                none;

            user-select:
                none;

            cursor:
                grab;

            will-change:
                transform;

        }


        .overlay.dragging {

            cursor:
                grabbing;

            transition:
                none;

            box-shadow:
                -18px 0 55px
                rgba(201,169,98,.22);

        }


        /* =========================================================
           OVERLAY CONTENT
        ========================================================= */

        .overlay-content-scale {

            width:
                100%;

            height:
                auto;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            transform-origin:
                center center;

            will-change:
                transform;

        }


        .overlay-content {

            width:
                100%;

            max-width:
                320px;

            flex-shrink:
                0;

        }


        /* =========================================================
           OVERLAY BADGE
        ========================================================= */

        .overlay-badge {

            display:
                inline-flex;

            align-items:
                center;

            justify-content:
                center;

            min-height:
                28px;

            padding:
                0 12px;

            margin-bottom:
                18px;

            border:
                1px solid
                rgba(255,255,255,.25);

            border-radius:
                999px;

            background:
                rgba(255,255,255,.09);

            backdrop-filter:
                blur(12px);

            font-size:
                9px;

            font-weight:
                900;

            letter-spacing:
                .15em;

            text-transform:
                uppercase;

        }


        /* =========================================================
           OVERLAY TITLE
        ========================================================= */

        .overlay h2 {

            margin-bottom:
                14px;

            font-size:
                clamp(
                    28px,
                    4vw,
                    40px
                );

            line-height:
                1.04;

            letter-spacing:
                -.045em;

        }


        /* =========================================================
           OVERLAY DESCRIPTION
        ========================================================= */

        .overlay-description {

            max-width:
                320px;

            margin:
                0 auto 24px;

            color:
                rgba(255,255,255,.85);

            font-size:
                13px;

            line-height:
                1.7;

        }


        /* =========================================================
           HINT
        ========================================================= */

        .overlay-hint {

            margin-bottom:
                12px;

            color:
                rgba(255,255,255,.62);

            font-size:
                10px;

            line-height:
                1.5;

        }


        /* =========================================================
           ARROW BUTTON
        ========================================================= */

        .arrow-btn {

            position:
                relative;

            width:
                64px;

            height:
                64px;

            display:
                inline-flex;

            align-items:
                center;

            justify-content:
                center;

            border:
                1px solid
                rgba(255,255,255,.35);

            border-radius:
                50%;

            color:
                #ffffff;

            background:
                rgba(255,255,255,.10);

            backdrop-filter:
                blur(12px);

            cursor:
                pointer;

            font-size:
                28px;

            line-height:
                1;

            animation:
                arrowHeartbeat
                2.2s
                ease-in-out
                infinite;

            transition:
                transform .2s ease,
                background .2s ease,
                border-color .2s ease;

        }


        .arrow-btn::before {

            content:
                "";

            position:
                absolute;

            inset:
                -7px;

            border:
                1px solid
                rgba(255,255,255,.20);

            border-radius:
                50%;

            opacity:
                0;

            transform:
                scale(.82);

            animation:
                arrowRipple
                2.2s
                ease-out
                infinite;

            pointer-events:
                none;

        }


        .arrow-btn::after {

            content:
                "";

            position:
                absolute;

            inset:
                0;

            border-radius:
                50%;

            background:
                radial-gradient(
                    circle,
                    rgba(255,255,255,.14),
                    transparent 65%
                );

            opacity:
                .45;

            pointer-events:
                none;

        }


        @keyframes arrowHeartbeat {

            0%,
            100% {

                transform:
                    scale(1);

            }

            8% {

                transform:
                    scale(1.06);

            }

            16% {

                transform:
                    scale(1);

            }

            24% {

                transform:
                    scale(1.045);

            }

            32% {

                transform:
                    scale(1);

            }

            60% {

                transform:
                    scale(1);

            }

        }


        @keyframes arrowRipple {

            0% {

                opacity:
                    0;

                transform:
                    scale(.82);

            }

            10% {

                opacity:
                    .45;

            }

            55% {

                opacity:
                    0;

                transform:
                    scale(1.35);

            }

            100% {

                opacity:
                    0;

                transform:
                    scale(1.35);

            }

        }


        .arrow-btn:hover {

            transform:
                scale(1.08);

            background:
                rgba(255,255,255,.18);

            border-color:
                rgba(255,255,255,.52);

            animation-play-state:
                paused;

        }


        .arrow-btn:active {

            transform:
                scale(.94);

            animation-play-state:
                paused;

        }


        /* =========================================================
           DESKTOP
        ========================================================= */

        @media (min-width: 701px) {

            .auth-container.signup-open
            .overlay {

                transform:
                    translate3d(
                        -100%,
                        0,
                        0
                    );

            }

        }


        /* =========================================================
           TABLET
        ========================================================= */

        @media (min-width: 701px)
        and (max-width: 1000px) {

            .auth-container {

                width:
                    min(
                        94vw,
                        900px
                    );

                height:
                    min(
                        82dvh,
                        620px
                    );

            }


            .form-panel,
            .overlay {

                padding:
                    clamp(
                        20px,
                        4vw,
                        42px
                    );

            }


            .border-star {

                width:
                    2.5px;

                height:
                    2.5px;

            }

        }


        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 700px) {

            body {

                padding:
                    8px;

                overflow:
                    hidden;

            }


            .auth-container {

                width:
                    min(
                        94vw,
                        480px
                    );

                height:
                    min(
                        88dvh,
                        760px
                    );

                border-radius:
                    clamp(
                        18px,
                        5vw,
                        25px
                    );

            }


            /* ---------------------------------------------
               VERTICAL FORMS
            --------------------------------------------- */

            .forms {

                flex-direction:
                    column;

            }


            .form-panel {

                width:
                    100%;

                height:
                    50%;

                flex:
                    0 0 50%;

                padding:
                    clamp(
                        8px,
                        5vw,
                        32px
                    );

            }


            .form-content {

                max-width:
                    min(
                        90%,
                        380px
                    );

            }


            /* ---------------------------------------------
               VERTICAL OVERLAY
            --------------------------------------------- */

            .overlay {

                top:
                    auto;

                right:
                    0;

                bottom:
                    0;

                width:
                    100%;

                height:
                    50%;

                padding:
                    clamp(
                        8px,
                        5vw,
                        32px
                    );

                transform:
                    translate3d(
                        0,
                        0,
                        0
                    );

                box-shadow:
                    0 -20px 55px
                    rgba(0,0,0,.16);

            }


            /*
             * Login -> Sign Up
             *
             * Panel bergerak ke atas.
             */

            .auth-container.signup-open
            .overlay {

                transform:
                    translate3d(
                        0,
                        -100%,
                        0
                    );

            }


            /*
             * Mobile arrow mengikuti arah
             * gerakan overlay.
             */

            .arrow-btn {

                width:
                    clamp(
                        48px,
                        14vw,
                        62px
                    );

                height:
                    clamp(
                        48px,
                        14vw,
                        62px
                    );

                font-size:
                    clamp(
                        22px,
                        7vw,
                        30px
                    );

            }


            .border-star {

                width:
                    2.5px;

                height:
                    2.5px;

                box-shadow:

                    0 0 3px
                    rgba(255,255,255,.98),

                    0 0 6px
                    rgba(255,255,255,.82),

                    0 0 11px
                    rgba(255,255,255,.52),

                    0 0 17px
                    rgba(255,255,255,.20);

            }


            .border-star::before {

                width:
                    11px;

            }


            .border-star::after {

                height:
                    11px;

            }

        }


        /* =========================================================
           SMALL PHONE
        ========================================================= */

        @media (max-width: 420px) {

            .auth-container {

                width:
                    95vw;

                height:
                    min(
                        90dvh,
                        720px
                    );

            }


            .form-panel,
            .overlay {

                padding:
                    clamp(
                        7px,
                        4vw,
                        20px
                    );

            }


            .form-content {

                max-width:
                    92%;

            }


            .form-kicker {

                font-size:
                    8px;

            }


            .form-content h1 {

                font-size:
                    clamp(
                        23px,
                        8vw,
                        30px
                    );

            }


            .form-description {

                margin-bottom:
                    16px;

                font-size:
                    10px;

            }


            .field {

                margin-bottom:
                    9px;

            }


            .field label {

                font-size:
                    10px;

            }


            .field input {

                height:
                    clamp(
                        39px,
                        11vw,
                        47px
                    );

                padding:
                    0 11px;

                font-size:
                    11px;

            }


            .submit-btn {

                min-height:
                    clamp(
                        39px,
                        11vw,
                        48px
                    );

                border-radius:
                    11px;

                font-size:
                    11px;

            }


            .overlay-badge {

                min-height:
                    23px;

                padding:
                    0 9px;

                margin-bottom:
                    10px;

                font-size:
                    7px;

            }


            .overlay h2 {

                font-size:
                    clamp(
                        23px,
                        8vw,
                        30px
                    );

            }


            .overlay-description {

                max-width:
                    90%;

                margin-bottom:
                    14px;

                font-size:
                    10px;

            }


            .overlay-hint {

                margin-bottom:
                    8px;

                font-size:
                    8px;

            }


            .arrow-btn {

                width:
                    clamp(
                        45px,
                        14vw,
                        56px
                    );

                height:
                    clamp(
                        45px,
                        14vw,
                        56px
                    );

                font-size:
                    23px;

            }


            .border-star {

                width:
                    2px;

                height:
                    2px;

            }

        }


        /* =========================================================
           VERY SMALL PHONE
        ========================================================= */

        @media (max-width: 360px) {

            .auth-container {

                width:
                    96vw;

                    91dvh;

            .form-panel,

        ========================================================= */

        @media (max-width: 700px)

                    5px;

        /* =========================================================

        /* =========================================================

        @media (prefers-reduced-motion: reduce) {

            .overlay,
            .submit-btn,

            .form-panel {

                animation:
                    none !important;

                    none !important;

            }

        }

    </style>

</head>

<script>

/* =========================================================
   ELEMENTS
========================================================= */

const authContainer =
    document.getElementById(
        "authContainer"
    );


const loginPanel =
    document.getElementById(
        "loginPanel"
    );


const signupPanel =
    document.getElementById(
        "signupPanel"
    );


const loginScale =
    document.getElementById(
        "loginScale"
    );


const signupScale =
    document.getElementById(
        "signupScale"
    );


const overlay =
    document.getElementById(
        "overlay"
    );


const overlayScale =
    document.getElementById(
        "overlayScale"
    );


const arrowBtn =
    document.getElementById(
        "arrowBtn"
    );


const overlayTitle =
    document.getElementById(
        "overlayTitle"
    );


const overlayDescription =
    document.getElementById(
        "overlayDescription"
    );


const loginForm =
    document.getElementById(
        "loginForm"
    );


const signupForm =
    document.getElementById(
        "signupForm"
    );


const borderStars =
    document.querySelectorAll(
        ".border-star"
    );


/* =========================================================
   STATE
========================================================= */

let signupOpen =
    false;


let dragging =
    false;


let didDrag =
    false;


let pointerStartX =
    0;


let pointerStartY =
    0;


let overlayStartX =
    0;


let overlayStartY =
    0;


let resizeTimer =
    null;


let borderAnimationFrame =
    null;


/*
 * Swipe threshold.
 */
const SWIPE_THRESHOLD =
    75;


/*
 * Kecepatan cahaya border.
 *
 * Lebih kecil = lebih pelan.
 */
const BORDER_SPEED =
    0.006;


/* =========================================================
   DEVICE
========================================================= */

function isMobile() {

    return window.matchMedia(
        "(max-width: 700px)"
    ).matches;

}


/* =========================================================
   OVERLAY CONTENT
========================================================= */

function updateOverlayContent() {

    const mobile =
        isMobile();


    /*
     * LOGIN AKTIF
     *
     * Desktop:
     * ← buka Sign Up
     *
     * Mobile:
     * ↑ buka Sign Up
     */

    if (!signupOpen) {

        overlayTitle.textContent =
            "Welcome Back";


        overlayDescription.textContent =
            "Sudah punya akun? Masuk dan lanjutkan perjalananmu.";


        arrowBtn.textContent =
            mobile
                ? "↑"
                : "←";


        arrowBtn.setAttribute(
            "aria-label",
            "Open sign up"
        );


        return;

    }


    /*
     * SIGN UP AKTIF
     *
     * Desktop:
     * → kembali Login
     *
     * Mobile:
     * ↓ kembali Login
     */

    overlayTitle.textContent =
        "Create Account";


    overlayDescription.textContent =
        "Belum punya akun? Daftar sekarang dan mulai perjalananmu.";


    arrowBtn.textContent =
        mobile
            ? "↓"
            : "→";


    arrowBtn.setAttribute(
        "aria-label",
        "Back to login"
    );

}


/* =========================================================
   APPLY STATE
========================================================= */

function applyState(
    animate = true
) {

    if (!animate) {

        const oldTransition =
            overlay.style.transition;


        overlay.style.transition =
            "none";


        authContainer.classList.toggle(
            "signup-open",
            signupOpen
        );


        requestAnimationFrame(
            function() {

                requestAnimationFrame(
                    function() {

                        overlay.style.transition =
                            oldTransition;

                    }
                );

            }
        );

    } else {

        authContainer.classList.toggle(
            "signup-open",
            signupOpen
        );

    }


    updateOverlayContent();

}


/* =========================================================
   CONTENT SCALE
========================================================= */

function scaleContentToPanel(
    panel,
    scaleElement
) {

    if (
        !panel ||
        !scaleElement
    ) {

        return;

    }


    /*
     * Reset terlebih dahulu.
     */

    scaleElement.style.transform =
        "scale(1)";


    /*
     * Force reflow.
     */

    void scaleElement.offsetWidth;


    const availableWidth =
        panel.clientWidth;


    const availableHeight =
        panel.clientHeight;


    const contentWidth =
        scaleElement.scrollWidth;


    const contentHeight =
        scaleElement.scrollHeight;


    if (
        availableWidth <= 0 ||
        availableHeight <= 0 ||
        contentWidth <= 0 ||
        contentHeight <= 0
    ) {

        return;

    }


    /*
     * Safe area.
     */

    const safeWidth =
        availableWidth * .88;


    const safeHeight =
        availableHeight * .88;


    const widthScale =
        safeWidth /
        contentWidth;


    const heightScale =
        safeHeight /
        contentHeight;


    /*
     * Ambil scale terkecil
     * agar semua isi tetap muat.
     */

    const scale =
        Math.min(
            1,
            widthScale,
            heightScale
        );


    /*
     * Batas minimum agar
     * teks tidak terlalu kecil.
     */

    const finalScale =
        Math.max(
            .62,
            scale
        );


    scaleElement.style.transform =
        `scale(${finalScale})`;

}


/* =========================================================
   RESIZE INNER CONTENT
========================================================= */

function resizeInnerContent() {

    requestAnimationFrame(
        function() {

            scaleContentToPanel(
                loginPanel,
                loginScale
            );


            scaleContentToPanel(
                signupPanel,
                signupScale
            );


            scaleContentToPanel(
                overlay,
                overlayScale
            );

        }
    );

}


/* =========================================================
   TOGGLE AUTH
========================================================= */

function toggleAuth() {

    signupOpen =
        !signupOpen;


    applyState(
        true
    );


    resizeInnerContent();

}


/* =========================================================
   ARROW CLICK
========================================================= */

arrowBtn.addEventListener(
    "click",
    function(event) {

        event.stopPropagation();


        /*
         * Kalau event ini terjadi
         * setelah drag, jangan toggle dua kali.
         */

        if (didDrag) {

            didDrag =
                false;

            return;
        }


        toggleAuth();

    }
);


/* =========================================================
   POINTER DOWN
========================================================= */

overlay.addEventListener(
    "pointerdown",
    function(event) {

        /*
         * Kalau tombol panah,
         * biarkan click handler yang menangani.
         */

        if (
            event.target.closest(
                ".arrow-btn"
            )
        ) {

            return;
        }


        dragging =
            true;


        didDrag =
            false;


        pointerStartX =
            event.clientX;


        pointerStartY =
            event.clientY;


        /*
         * Simpan posisi awal overlay.
         */

        if (isMobile()) {

            overlayStartY =
                signupOpen
                    ? -overlay.offsetHeight
                    : 0;

        } else {

            overlayStartX =
                signupOpen
                    ? -overlay.offsetWidth
                    : 0;

        }


        overlay.classList.add(
            "dragging"
        );


        /*
         * FIXED BLUR:
         *
         * langsung aktif ketika
         * drag dimulai.
         */

        authContainer.classList.add(
            "is-dragging"
        );


        try {

            overlay.setPointerCapture(
                event.pointerId
            );

        } catch (error) {

            /*
             * Aman diabaikan.
             */

        }

    }
);


/* =========================================================
   POINTER MOVE
========================================================= */

overlay.addEventListener(
    "pointermove",
    function(event) {

        if (!dragging) {

            return;
        }


        const deltaX =
            event.clientX -
            pointerStartX;


        const deltaY =
            event.clientY -
            pointerStartY;


        /*
         * Benar-benar drag.
         */

        if (
            Math.abs(deltaX) > 7 ||
            Math.abs(deltaY) > 7
        ) {

            didDrag =
                true;

        }


        /* =====================================================
           MOBILE
        ===================================================== */

        if (isMobile()) {

            let nextY =
                overlayStartY +
                deltaY;


            const distance =
                overlay.offsetHeight;


            const minY =
                -distance;


            const maxY =
                0;


            nextY =
                Math.max(
                    minY,
                    Math.min(
                        maxY,
                        nextY
                    )
                );


            overlay.style.transform =
                `translate3d(
                    0,
                    ${nextY}px,
                    0
                )`;


            return;

        }


        /* =====================================================
           DESKTOP / TABLET
        ===================================================== */

        let nextX =
            overlayStartX +
            deltaX;


        const distance =
            overlay.offsetWidth;


        const minX =
            -distance;


        const maxX =
            0;


        nextX =
            Math.max(
                minX,
                Math.min(
                    maxX,
                    nextX
                )
            );


        overlay.style.transform =
            `translate3d(
                ${nextX}px,
                0,
                0
            )`;

    }
);


/* =========================================================
   FINISH DRAG
========================================================= */

function finishDrag(event) {

    if (!dragging) {

        return;
    }


    dragging =
        false;


    overlay.classList.remove(
        "dragging"
    );


    /*
     * Fixed blur dimatikan.
     */

    authContainer.classList.remove(
        "is-dragging"
    );


    const deltaX =
        event.clientX -
        pointerStartX;


    const deltaY =
        event.clientY -
        pointerStartY;


    /* =====================================================
       MOBILE
    ===================================================== */

    if (isMobile()) {

        /*
         * Swipe UP:
         * Login -> Sign Up
         */

        if (
            !signupOpen &&
            deltaY <
                -SWIPE_THRESHOLD
        ) {

            signupOpen =
                true;

        }


        /*
         * Swipe DOWN:
         * Sign Up -> Login
         */

        else if (
            signupOpen &&
            deltaY >
                SWIPE_THRESHOLD
        ) {

            signupOpen =
                false;

        }

    }


    /* =====================================================
       DESKTOP / TABLET
    ===================================================== */

    else {

        /*
         * Swipe LEFT:
         * Login -> Sign Up
         */

        if (
            !signupOpen &&
            deltaX <
                -SWIPE_THRESHOLD
        ) {

            signupOpen =
                true;

        }


        /*
         * Swipe RIGHT:
         * Sign Up -> Login
         */

        else if (
            signupOpen &&
            deltaX >
                SWIPE_THRESHOLD
        ) {

            signupOpen =
                false;

        }

    }


    /*
     * Hapus transform manual.
     */

    overlay.style.transform =
        "";


    /*
     * Snap ke posisi final.
     */

    applyState(
        true
    );


    resizeInnerContent();


    try {

        overlay.releasePointerCapture(
            event.pointerId
        );

    } catch (error) {

        /*
         * Aman diabaikan.
         */

    }

}


/* =========================================================
   POINTER UP
========================================================= */

overlay.addEventListener(
    "pointerup",
    finishDrag
);


/* =========================================================
   POINTER CANCEL
========================================================= */

overlay.addEventListener(
    "pointercancel",
    function(event) {

        dragging =
            false;


        overlay.classList.remove(
            "dragging"
        );


        authContainer.classList.remove(
            "is-dragging"
        );


        overlay.style.transform =
            "";


        applyState(
            false
        );


        resizeInnerContent();


        try {

            overlay.releasePointerCapture(
                event.pointerId
            );

        } catch (error) {

            /*
             * Aman diabaikan.
             */

        }

    }
);


/* =========================================================
   BORDER GEOMETRY
========================================================= */

/*
 * Menghitung titik tepat
 * di perimeter rounded rectangle.
 */

function getBorderPoint(
    distance,
    width,
    height,
    radius
) {

    const r =
        Math.min(
            radius,
            width / 2,
            height / 2
        );


    const topLength =
        Math.max(
            0,
            width -
            2 * r
        );


    const sideLength =
        Math.max(
            0,
            height -
            2 * r
        );


    const cornerLength =
        Math.PI *
        r /
        2;


    const perimeter =
        (topLength * 2) +
        (sideLength * 2) +
        (cornerLength * 4);


    let d =
        distance %
        perimeter;


    if (
        d < 0
    ) {

        d +=
            perimeter;

    }


    /* =====================================================
       TOP
    ===================================================== */

    if (
        d <= topLength
    ) {

        return {

            x:
                r + d,

            y:
                0

        };

    }


    d -=
        topLength;


    /* =====================================================
       TOP RIGHT
    ===================================================== */

    if (
        d <= cornerLength
    ) {

        const angle =
            -Math.PI / 2 +
            d / r;


        return {

            x:
                width -
                r +
                Math.cos(angle) *
                r,

            y:
                r +
                Math.sin(angle) *
                r

        };

    }


    d -=
        cornerLength;


    /* =====================================================
       RIGHT
    ===================================================== */

    if (
        d <= sideLength
    ) {

        return {

            x:
                width,

            y:
                r + d

        };

    }


    d -=
        sideLength;


    /* =====================================================
       BOTTOM RIGHT
    ===================================================== */

    if (
        d <= cornerLength
    ) {

        const angle =
            d / r;


        return {

            x:
                width -
                r +
                Math.cos(angle) *
                r,

            y:
                height -
                r +
                Math.sin(angle) *
                r

        };

    }


    d -=
        cornerLength;


    /* =====================================================
       BOTTOM
    ===================================================== */

    if (
        d <= topLength
    ) {

        return {

            x:
                width -
                r -
                d,

            y:
                height

        };

    }


    d -=
        topLength;


    /* =====================================================
       BOTTOM LEFT
    ===================================================== */

    if (
        d <= cornerLength
    ) {

        const angle =
            Math.PI / 2 +
            d / r;


        return {

            x:
                r +
                Math.cos(angle) *
                r,

            y:
                height -
                r +
                Math.sin(angle) *
                r

        };

    }


    d -=
        cornerLength;


    /* =====================================================
       LEFT
    ===================================================== */

    if (
        d <= sideLength
    ) {

        return {

            x:
                0,

            y:
                height -
                r -
                d

        };

    }


    d -=
        sideLength;


    /* =====================================================
       TOP LEFT
    ===================================================== */

    const angle =
        Math.PI +
        d / r;


    return {

        x:
            r +
            Math.cos(angle) *
            r,

        y:
            r +
            Math.sin(angle) *
            r

    };

}


/* =========================================================
   INITIALIZE BORDER STAR POSITIONS
========================================================= */

function initializeBorderStars() {

    if (
        !borderStars.length
    ) {

        return;
    }


    const rect =
        authContainer.getBoundingClientRect();


    const width =
        rect.width;


    const height =
        rect.height;


    const style =
        getComputedStyle(
            authContainer
        );


    let radius =
        parseFloat(
            style.borderTopLeftRadius
        );


    if (
        !Number.isFinite(radius)
    ) {

        radius =
            24;

    }


    const r =
        Math.min(
            radius,
            width / 2,
            height / 2
        );


    const topLength =
        Math.max(
            0,
            width -
            2 * r
        );


    const sideLength =
        Math.max(
            0,
            height -
            2 * r
        );


    const cornerLength =
        Math.PI *
        r /
        2;


    const perimeter =
        (topLength * 2) +
        (sideLength * 2) +
        (cornerLength * 4);


    /*
     * 8 cahaya disebar
     * mengelilingi perimeter.
     */

    const positions = [

        .015,
        .135,
        .255,
        .385,
        .515,
        .645,
        .775,
        .905

    ];


    borderStars.forEach(
        function(star,index) {

            const distance =
                perimeter *
                positions[index];


            star.dataset.distance =
                distance.toString();


            /*
             * Masing-masing bintang
             * punya ritme berbeda.
             */

            const duration =
                2.7 +
                (
                    index % 4
                ) * .45;


            star.style.setProperty(
                "--twinkle-duration",
                `${duration}s`
            );


            /*
             * Offset waktu berbeda.
             */

            star.style.animationDelay =
                `${-(index * .37)}s`;


            star.classList.add(
                "active"
            );

        }
    );

}


/* =========================================================
   BORDER ANIMATION
========================================================= */

function animateBorderStars(
    timestamp
) {

    const rect =
        authContainer.getBoundingClientRect();


    const width =
        rect.width;


    const height =
        rect.height;


    const style =
        getComputedStyle(
            authContainer
        );


    let radius =
        parseFloat(
            style.borderTopLeftRadius
        );


    if (
        !Number.isFinite(radius)
    ) {

        radius =
            24;

    }


    const r =
        Math.min(
            radius,
            width / 2,
            height / 2
        );


    const topLength =
        Math.max(
            0,
            width -
            2 * r
        );


    const sideLength =
        Math.max(
            0,
            height -
            2 * r
        );


    const cornerLength =
        Math.PI *
        r /
        2;


    const perimeter =
        (topLength * 2) +
        (sideLength * 2) +
        (cornerLength * 4);


    /*
     * Gerakkan bintang pelan.
     */

    borderStars.forEach(
        function(star) {

            let distance =
                parseFloat(
                    star.dataset.distance
                );


            if (
                !Number.isFinite(distance)
            ) {

                distance =
                    0;

            }


            /*
             * Gerak berdasarkan waktu
             * supaya stabil.
             */

            distance +=
                16.67 *
                BORDER_SPEED;


            if (
                distance >= perimeter
            ) {

                distance -=
                    perimeter;

            }


            star.dataset.distance =
                distance.toString();


            const point =
                getBorderPoint(
                    distance,
                    width,
                    height,
                    r
                );


            /*
             * Tepat pada garis border.
             */

            star.style.left =
                `${point.x}px`;


            star.style.top =
                `${point.y}px`;

        }
    );


    borderAnimationFrame =
        requestAnimationFrame(
            animateBorderStars
        );

}


/* =========================================================
   START BORDER ANIMATION
========================================================= */

function startBorderAnimation() {

    if (
        borderAnimationFrame
    ) {

        cancelAnimationFrame(
            borderAnimationFrame
        );

    }


    initializeBorderStars();


    borderAnimationFrame =
        requestAnimationFrame(
            animateBorderStars
        );

}


/* =========================================================
   RESIZE HANDLER
========================================================= */

function handleResize() {

    clearTimeout(
        resizeTimer
    );


    resizeTimer =
        setTimeout(
            function() {

                /*
                 * Clear manual transform.
                 */

                overlay.style.transform =
                    "";


                /*
                 * Update desktop/mobile arrow.
                 */

                updateOverlayContent();


                /*
                 * Recalculate content.
                 */

                resizeInnerContent();


                /*
                 * Recalculate border geometry.
                 */

                initializeBorderStars();


                /*
                 * Reapply actual state.
                 */

                applyState(
                    false
                );

            },
            80
        );

}


window.addEventListener(
    "resize",
    handleResize
);


window.addEventListener(
    "orientationchange",
    handleResize
);


/* =========================================================
   RESIZE OBSERVER
========================================================= */

if (
    "ResizeObserver"
    in window
) {

    const resizeObserver =
        new ResizeObserver(
            function() {

                if (!dragging) {

                    resizeInnerContent();

                    initializeBorderStars();

                }

            }
        );


    resizeObserver.observe(
        authContainer
    );


    resizeObserver.observe(
        loginPanel
    );


    resizeObserver.observe(
        signupPanel
    );


    resizeObserver.observe(
        overlay
    );

}


/* =========================================================
   FORM DEMO
========================================================= */

loginForm.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();


        alert(
            "Login form submitted."
        );

    }
);


signupForm.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();


        alert(
            "Sign Up form submitted."
        );

    }
);


/* =========================================================
   INITIALIZE
========================================================= */

function initialize() {

    /*
     * Default:
     * Login aktif.
     */

    signupOpen =
        false;


    updateOverlayContent();


    applyState(
        false
    );


    resizeInnerContent();


    /*
     * Border lights.
     */

    startBorderAnimation();

}


if (
    document.readyState ===
    "loading"
) {

    document.addEventListener(
        "DOMContentLoaded",
        initialize,
        {
            once:
                true
        }
    );

} else {

    initialize();

}


/*
 * Final pass setelah semua
 * resource selesai.
 */

window.addEventListener(
    "load",
    function() {

        resizeInnerContent();

        startBorderAnimation();

    },
    {
        once:
            true
    }
);

</script>
