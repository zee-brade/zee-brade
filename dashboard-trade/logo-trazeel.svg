<?xml version="1.0" encoding="UTF-8"?>
<!-- Simplified TRAZEEL logo (SVG) — kept recognizable mark + wordmark
     - Mark: rounded square with stylized T/bar motif
     - Wordmark: TRAZEEL in uppercase, slightly condensed
-->
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="120" viewBox="0 0 400 120" role="img" aria-labelledby="titleDesc">
  <title id="titleDesc">Trazeel logo</title>
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>
  <!-- Mark -->
  <g transform="translate(10,10)">
    <rect x="0" y="0" width="80" height="80" rx="18" fill="url(#g1)" opacity="0.95" />
    <!-- stylized T made from three bars -->
    <g transform="translate(20,18)" fill="#042826">
      <rect x="0" y="0" width="40" height="8" rx="4"></rect>
      <rect x="16" y="8" width="8" height="36" rx="4"></rect>
      <rect x="0" y="44" width="40" height="8" rx="4" opacity="0.03"></rect>
    </g>
  </g>
  <!-- Wordmark -->
  <g transform="translate(110,60)" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial" font-weight="800" fill="#dffbf6">
    <text x="0" y="8" font-size="42" letter-spacing="0.06em">TRAZEEL</text>
  </g>
</svg>
