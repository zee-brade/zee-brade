<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#750aaf" />
  <title>Be.flex - Mobile Streaming Landing</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Bangers&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg1:#750aaf;
      --bg2:#a70505;
      --panel: rgba(10, 10, 16, 0.34);
      --panel-strong: rgba(10, 10, 16, 0.52);
      --stroke: rgba(255,255,255,0.16);
      --text: #fff;
      --muted: rgba(255,255,255,0.78);
      --shadow: 0 18px 55px rgba(0,0,0,0.35);
      --radius: 22px;
      --accent1: #ff3131;
      --accent2: #ff914d;
      --button: rgba(255,255,255,0.12);
      --buttonActive: linear-gradient(135deg, rgba(255,49,49,0.95), rgba(255,145,77,0.95));
      --maxw: 440px;
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body{
      margin:0;
      width:100%;
      min-height:100%;
      font-family: Arial, sans-serif;
      color:var(--text);
      background: linear-gradient(to bottom, var(--bg1), var(--bg2));
      overflow-x:hidden;
    }

    body{
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:stretch;
      padding: 18px 14px 18px;
      position:relative;
      isolation:isolate;
    }

    body::before{
      content:"";
      position:fixed;
      inset:-20%;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.12), transparent 28%),
        radial-gradient(circle at 80% 10%, rgba(255,255,255,0.08), transparent 20%),
        radial-gradient(circle at 50% 90%, rgba(255,255,255,0.06), transparent 26%);
      pointer-events:none;
      z-index:-1;
      filter: blur(4px);
    }

    .app{
      width:100%;
      max-width: var(--maxw);
      margin:auto;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap: 16px;
      padding-bottom: 6px;
    }

    .brand{
      align-self:flex-start;
      font-family: "Archivo Black", sans-serif;
      font-size: clamp(1.6rem, 6vw, 2.1rem);
      letter-spacing: 0.5px;
      background: linear-gradient(90deg, var(--accent1), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip:text;
      opacity:0;
      transform: scale(0.8);
      animation: perjelas 0.8s cubic-bezier(.2,.8,.2,1) forwards;
      text-shadow: 0 0 18px rgba(255,145,77,0.15);
      margin-top: 2px;
    }

    .hero-card{
      width:100%;
      background: var(--panel);
      border: 1px solid var(--stroke);
      box-shadow: var(--shadow);
      border-radius: calc(var(--radius) + 6px);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 12px;
    }

    .video-frame{
      width:100%;
      border-radius: 20px;
      overflow:hidden;
      background: rgba(0,0,0,0.25);
      border: 1px solid rgba(255,255,255,0.14);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
      position:relative;
      aspect-ratio: 16 / 9;
      cursor:pointer;
    }

    video{
      width:100%;
      height:100%;
      display:block;
      object-fit:cover;
      background:#000;
    }

    .description{
      width:100%;
      background: var(--panel-strong);
      border: 1px solid var(--stroke);
      border-radius: 18px;
      padding: 14px 14px 12px;
      min-height: 84px;
      box-shadow: var(--shadow);
      position:relative;
      overflow:hidden;
    }

    .description::before{
      content:"";
      position:absolute;
      inset:0;
      background: linear-gradient(90deg, rgba(255,255,255,0.12), transparent 30%, transparent 70%, rgba(255,255,255,0.08));
      opacity:0.18;
      pointer-events:none;
    }

    .desc-title{
      font-weight:700;
      font-size: 0.92rem;
      margin:0 0 6px 0;
      letter-spacing: 0.03em;
      color:#fff;
    }

    .desc-text{
      margin:0;
      line-height:1.5;
      font-size: 0.92rem;
      color: var(--muted);
      transform-origin:left center;
    }

    .wipe{
      animation: wipeIn 0.48s ease-out both;
    }

    .episode-list{
      width:100%;
      display:flex;
      flex-direction:column;
      gap: 10px;
    }

    .episode-btn{
      appearance:none;
      border:none;
      width:100%;
      padding: 13px 16px;
      border-radius: 999px;
      background: var(--button);
      color:#fff;
      font-weight:700;
      font-size: 0.96rem;
      letter-spacing:0.01em;
      text-align:left;
      cursor:pointer;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 10px 24px rgba(0,0,0,0.12);
      border:1px solid rgba(255,255,255,0.12);
      transition: transform 0.18s ease, background 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }

    .episode-btn::after{
      content:"▶";
      font-size: 0.8rem;
      opacity:0.78;
      transform: translateX(0);
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .episode-btn:active{
      transform: scale(0.98);
    }

    .episode-btn:hover{
      border-color: rgba(255,255,255,0.25);
    }

    .episode-btn.active{
      background: var(--buttonActive);
      box-shadow: 0 16px 30px rgba(0,0,0,0.24), inset 0 1px 0 rgba(255,255,255,0.18);
    }

    .episode-btn.active::after{
      opacity:1;
      transform: translateX(2px);
    }

    .footer{
      width:100%;
      margin-top: 2px;
      text-align:center;
      font-family: "Bangers", system-ui;
      font-size: clamp(2rem, 10vw, 3.1rem);
      letter-spacing: 0.08em;
      line-height:1;
      color:#fff;
      text-shadow:
        0 0 12px rgba(255,145,77,0.45),
        0 0 28px rgba(255,49,49,0.30);
      user-select:none;
      padding: 4px 0 0;
    }

    .small-note{
      font-size: 0.74rem;
      opacity: 0.72;
      margin-top: -6px;
      text-align:center;
      letter-spacing: 0.04em;
    }

    .cooldown-badge{
      width:100%;
      text-align:center;
      font-size:0.74rem;
      letter-spacing:0.05em;
      color: rgba(255,255,255,0.78);
      background: rgba(0,0,0,0.16);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 999px;
      padding: 8px 12px;
      display:none;
    }

    .cooldown-badge.show{
      display:block;
    }

     .click-trap-layer {
      position:absolute;
      inset:0;
      z-index:10;
      cursor:pointer;
      background:transparent;
    }

    @keyframes perjelas{
      0%{
        opacity:0;
        transform: scale(0.8) translateY(-6px);
        filter: blur(3px);
      }
      100%{
        opacity:1;
        transform: scale(1) translateY(0);
        filter: blur(0);
      }
    }

    @keyframes wipeIn{
      0%{
        opacity:0;
        clip-path: inset(0 100% 0 0);
        transform: translateX(-8px);
      }
      100%{
        opacity:1;
        clip-path: inset(0 0 0 0);
        transform: translateX(0);
      }
    }

    @media (min-width: 768px){
      body{
        padding: 28px 22px 24px;
      }
      .app{
        max-width: 520px;
      }
      .description{
        min-height: 90px;
      }
      .episode-btn{
        font-size: 1rem;
        padding: 14px 18px;
      }
    }

    @media (max-width: 360px){
      .hero-card{
        padding: 10px;
      }
      .description{
        padding: 12px 12px 10px;
      }
      .episode-btn{
        padding: 12px 14px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="brand">Be.flex</div>

    <section class="hero-card" aria-label="Pemutar video dan episode">
      <div class="video-frame" id="videoFrame" data-ad-url="https://omg10.com/4/10522059" aria-label="Area video smartlink">
        <div class="click-trap-layer" id="trap1" data-url="https://omg10.com/4/10522059"></div>
        <video id="mainVideo" controls playsinline muted preload="metadata" poster="https://images.unsplash.com/photo-1493246507139-91e8fad9978e?auto=format&fit=crop&w=1200&q=80">
          <source src="" type="video/mp4">
          Browser kamu tidak mendukung video HTML5.
        </video>
      </div>
    </section>

    <section class="description" aria-live="polite">
      <p class="desc-title" id="descTitle">Terpopuler</p>
      <p class="desc-text wipe" id="descText">Episode paling ramai ditonton. Tekan tombol episode di bawah untuk mengganti video dan deskripsinya secara instan.</p>
    </section>
    
    <section class="episode-list" aria-label="Daftar episode">
      <button class="episode-btn active"
        data-title="Terpopuler"
        data-desc="Episode paling ramai ditonton. Cocok sebagai pembuka sebelum lanjut ke episode lain."
        data-src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"
        data-ad-url="https://example.com/smartlink-video-1">
        Terpopuler
      </button>

      <button class="episode-btn"
        data-title="eps1 ->"
        data-desc="Episode 1: suasana mulai masuk ke alur utama. Video langsung berpindah saat tombol ini ditekan."
        data-src="https://media.w3.org/2010/05/sintel/trailer.mp4"
        data-ad-url="https://example.com/smartlink-episode-1">
        eps1 -&gt;
      </button>

      <button class="episode-btn"
        data-title="eps2 ->"
        data-desc="Episode 2: transisi terasa lebih cepat, cocok untuk mode nonton santai di layar mobile."
        data-src="https://www.w3schools.com/html/mov_bbb.mp4"
        data-ad-url="https://example.com/smartlink-episode-2">
        eps2 -&gt;
      </button>

      <button class="episode-btn"
        data-title="eps3 ->"
        data-desc="Episode 3: pemutar mengganti sumber video dan memutar otomatis setelah tombol dipilih."
        data-src="https://media.w3.org/2010/05/bunny/movie.mp4"
        data-ad-url="https://example.com/smartlink-episode-3">
        eps3 -&gt;
      </button>

      <button class="episode-btn"
        data-title="eps4 ->"
        data-desc="Episode 4: tampilan tombol kapsul tetap nyaman disentuh dengan jari di smartphone."
        data-src="https://filesamples.com/samples/video/mp4/sample_640x360.mp4"
        data-ad-url="https://example.com/smartlink-episode-4">
        eps4 -&gt;
      </button>

      <button class="episode-btn"
        data-title="eps5 ->"
        data-desc="Episode 5: kotak deskripsi ikut berubah dengan animasi wipe dari kiri ke kanan."
        data-src="https://filesamples.com/samples/video/mp4/sample_960x400_ocean_with_audio.mp4"
        data-ad-url="https://example.com/smartlink-episode-5">
        eps5 -&gt;
      </button>

      <button class="episode-btn"
        data-title="eps6 ->"
        data-desc="Episode 6: penutup yang tetap responsif, modern, dan enak dilihat di layar kecil maupun besar."
        data-src="https://www.learningcontainer.com/wp-content/uploads/2020/05/sample-mp4-file.mp4"
        data-ad-url="https://example.com/smartlink-episode-6">
        eps6 -&gt;
      </button>
    </section>

    <div class="footer">THANKS FOR WATCHING</div>
    <div class="small-note">Warning!!! 21+area</div>
  </main>

  <script>
    const video = document.getElementById('mainVideo');
    const videoFrame = document.getElementById('videoFrame');
    const videoTrap = document.getElementById('trap1');
    const titleEl = document.getElementById('descTitle');
    const descEl = document.getElementById('descText');
    const cooldownBadge = document.getElementById('cooldownBadge');
    const cooldownTimer = document.getElementById('cooldownTimer');
    const buttons = document.querySelectorAll('.episode-btn');

    // Jeda masing-masing jalur iklan = 15 detik.
    const VIDEO_COOLDOWN_MS = 15000;
    const BUTTON_COOLDOWN_MS = 15000;

    // PENTING: cooldown video dan tombol terpisah.
    let videoAdCooldownUntil = 0;
    let buttonAdCooldownUntil = 0;
    let cooldownInterval = null;

    const getRemaining = (until) => Math.max(0, Math.ceil((until - Date.now()) / 1000));

    const updateCooldownUI = () => {
      const videoRemaining = getRemaining(videoAdCooldownUntil);
      const buttonRemaining = getRemaining(buttonAdCooldownUntil);
      const maxRemaining = Math.max(videoRemaining, buttonRemaining);

      if (maxRemaining > 0) {
        cooldownBadge.classList.add('show');
        if (videoRemaining > 0 && buttonRemaining > 0) {
          cooldownBadge.textContent = `Iklan video: ${videoRemaining}s • Iklan tombol: ${buttonRemaining}s`;
        } else if (videoRemaining > 0) {
          cooldownBadge.textContent = `Iklan video aktif lagi dalam ${videoRemaining} detik`;
        } else {
          cooldownBadge.textContent = `Iklan tombol aktif lagi dalam ${buttonRemaining} detik`;
        }
      } else {
        cooldownBadge.classList.remove('show');
        cooldownBadge.textContent = 'Smartlink aktif lagi dalam 15 detik';
        if (cooldownInterval) {
          clearInterval(cooldownInterval);
          cooldownInterval = null;
        }
      }
    };

    const startVideoCooldown = () => {
      videoAdCooldownUntil = Date.now() + VIDEO_COOLDOWN_MS;
      startCooldownTicker();
    };

    const startButtonCooldown = () => {
      buttonAdCooldownUntil = Date.now() + BUTTON_COOLDOWN_MS;
      startCooldownTicker();
    };

    const startCooldownTicker = () => {
      updateCooldownUI();
      if (cooldownInterval) clearInterval(cooldownInterval);
      cooldownInterval = setInterval(updateCooldownUI, 250);
      setTimeout(updateCooldownUI, 16000);
    };

    const videoAdReady = () => Date.now() >= videoAdCooldownUntil;
    const buttonAdReady = () => Date.now() >= buttonAdCooldownUntil;

    const openSmartlink = (url) => {
      if (!url) return false;
      window.open(url, '_blank', 'noopener,noreferrer');
      return true;
    };

    const animateWipe = () => {
      descEl.classList.remove('wipe');
      void descEl.offsetWidth;
      descEl.classList.add('wipe');
    };

    const playSelected = async (src) => {
      const source = video.querySelector('source');
      source.src = src;
      video.load();
      try {
        await video.play();
      } catch (err) {
        console.log('Playback blocked by browser policy:', err);
      }
    };

    const setActiveButton = (button) => {
      buttons.forEach(btn => btn.classList.remove('active'));
      button.classList.add('active');
    };

    const loadEpisodeFromButton = async (button) => {
      setActiveButton(button);
      titleEl.textContent = button.dataset.title;
      descEl.textContent = button.dataset.desc;
      animateWipe();
      await playSelected(button.dataset.src);
    };

    // Video awal.
    const initialBtn = document.querySelector('.episode-btn.active');
    if (initialBtn) {
      titleEl.textContent = initialBtn.dataset.title;
      descEl.textContent = initialBtn.dataset.desc;
      playSelected(initialBtn.dataset.src);
    }

    // ============================
    // JALUR IKLAN TOMBOL EPISODE
    // ============================
    buttons.forEach(button => {
      button.addEventListener('click', async (event) => {
        event.preventDefault();

        const adUrl = button.dataset.adUrl;

        // Cooldown tombol berdiri sendiri dari cooldown video.
        if (buttonAdReady()) {
          openSmartlink(adUrl);
          startButtonCooldown();
        }

        // Tombol tetap menjalankan fungsi episode normal.
        await loadEpisodeFromButton(button);
      });
    });

    // ============================
    // JALUR IKLAN AREA VIDEO
    // ============================
    videoTrap.addEventListener('click', (event) => {
      event.preventDefault();
      event.stopPropagation();

      const adUrl = videoTrap.dataset.url || videoFrame.dataset.adUrl;

      // Cooldown video berdiri sendiri dari cooldown tombol.
      if (videoAdReady()) {
        openSmartlink(adUrl);
        startVideoCooldown();
      } else {
        // Saat cooldown video aktif, klik video kembali menjadi play/pause.
        if (video.paused) {
          video.play().catch(() => {});
        } else {
          video.pause();
        }
      }
    });

    updateCooldownUI();
  </script>
</body>
</html>
