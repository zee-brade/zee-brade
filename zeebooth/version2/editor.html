<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#d9e0e6">
  <title>Zeebooth · Edit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/editor.css">
</head>
<body data-page="editor">
  <header class="site-header compact-header">
    <a class="brand-mini" href="index.html">ZEEBOOTH</a>
    <nav class="glass-nav" aria-label="Primary navigation">
      <a class="nav-link" href="index.html" data-nav="home">Home</a>
      <a class="nav-link" href="photos.html" data-nav="photos">Photos</a>
      <a class="nav-link" href="history.html" data-nav="history">Riwayat</a>
    </nav>
  </header>

  <main class="editor-page">
    <section class="editor-shell">
      <div class="editor-head">
        <div>
          <span class="section-kicker">Editor</span>
          <h1>Make the final frame yours.</h1>
          <p>Photos keep their selected aspect ratio. The frame adapts around them.</p>
        </div>
        <div class="editor-actions">
          <button id="editorSaveButton" class="btn btn-primary" type="button">Save to Photos</button>
          <a href="camera.html" class="btn btn-secondary">Retake</a>
        </div>
      </div>

      <div class="editor-workspace">
        <div class="final-preview-panel glass-card">
          <div id="finalFrame" class="final-frame">
            <div id="frameDecor" class="frame-decor"></div>
            <div id="photoGrid" class="photo-grid"></div>
            <div class="frame-brand">ZEEBOOTH</div>
          </div>
        </div>

        <aside class="editor-controls glass-card">
          <div class="editor-group">
            <span class="section-kicker">Background</span>
            <div id="backgroundOptions" class="option-grid"></div>
          </div>

          <div class="editor-group">
            <span class="section-kicker">Layout</span>
            <div id="layoutOptions" class="option-grid"></div>
          </div>

          <div class="editor-group">
            <span class="section-kicker">Decor</span>
            <button id="sparkleDecor" class="mini-option active" type="button">Soft sparkles</button>
            <button id="cleanDecor" class="mini-option" type="button">Clean</button>
          </div>

          <div class="editor-note">
            <strong>Preview rule</strong>
            <span>The captured photos are fitted without changing their underlying aspect ratio.</span>
          </div>
        </aside>
      </div>
    </section>
  </main>

  <script src="js/app.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/frames.js"></script>
  <script src="js/editor.js"></script>
</body>
</html>
