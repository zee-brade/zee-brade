<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#d9e0e6">
  <title>Zeebooth · Photos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="photos">
  <header class="site-header compact-header">
    <a class="brand-mini" href="index.html">ZEEBOOTH</a>
    <nav class="glass-nav" aria-label="Primary navigation">
      <a class="nav-link" href="index.html" data-nav="home">Home</a>
      <a class="nav-link active" href="photos.html" data-nav="photos">Photos</a>
      <a class="nav-link" href="history.html" data-nav="history">Riwayat</a>
    </nav>
  </header>

  <main class="content-page">
    <section class="content-shell">
      <div class="page-title-row">
        <div>
          <span class="section-kicker">Your gallery</span>
          <h1>Photos</h1>
          <p>Final Zeebooth results saved in this browser.</p>
        </div>
        <a class="btn btn-primary" href="camera.html">New session</a>
      </div>

      <div id="photosGrid" class="photos-grid"></div>
      <div id="photosEmpty" class="empty-state glass-card hidden">
        <div class="empty-icon">🖼️</div>
        <h2>No saved photos yet.</h2>
        <p>Take your first Zeebooth session and save the final frame here.</p>
        <a class="btn btn-primary" href="camera.html">Start photobooth</a>
      </div>
    </section>
  </main>

  <script src="js/app.js"></script>
  <script src="js/storage.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", renderPhotosPage);
  </script>
</body>
</html>
